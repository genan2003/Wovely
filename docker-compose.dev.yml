# Local development only: publishes the infrastructure ports so services can run on the host.
#   make infra   starts MongoDB, Redis and RabbitMQ with these ports on 127.0.0.1
services:
  redis:
    ports:
      - "127.0.0.1:6379:6379"
  rabbitmq:
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
