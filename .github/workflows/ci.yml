name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [wovely, products, inventory]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit + integration tests (Testcontainers) + coverage
        run: mvn -B verify
      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.service }}-reports
          path: |
            backend/${{ matrix.service }}/target/surefire-reports
            backend/${{ matrix.service }}/target/failsafe-reports
            backend/${{ matrix.service }}/target/site/jacoco
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/frontend/package-lock.json
      - run: npm ci
      - name: Unit tests (Vitest)
        run: npx ng test --watch=false
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E smoke tests
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/frontend/playwright-report
          if-no-files-found: ignore

  api:
    name: API (Postman / newman)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build wp2-project inventory products wovely-backend
      - name: Wait for services
        run: |
          for url in http://localhost:8082/api/categories http://localhost:8082/api/products; do
            for i in $(seq 1 60); do curl -fs "$url" >/dev/null && break; sleep 3; done
          done
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
              -d '{"username":"admin","password":"admin123"}' http://localhost:8081/api/auth/signin)
            [ "$code" = "200" ] && break; sleep 3
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Postman collection
        run: make test-api ENV=local
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Upload newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: postman/results
          if-no-files-found: ignore

  diagrams:
    name: PlantUML render check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PlantUML
        run: sudo apt-get update && sudo apt-get install -y plantuml
      - name: Render all diagrams (fails on syntax errors)
        run: |
          if find docs/diagrams -name '*.puml' 2>/dev/null | grep -q .; then make diagrams; else echo "No diagrams yet"; fi
