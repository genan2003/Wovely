spring.application.name=wovely
server.port=8081

spring.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/wp2-project}
# Create @Indexed / @CompoundIndex indexes on startup (PLAN.md 2.10)
spring.data.mongodb.auto-index-creation=true

# Secrets come from the environment (see .env.example). No defaults on purpose.
wovely.app.jwtSecret=${JWT_SECRET}
# Access tokens are short-lived (15 min); clients renew them with the refresh token (7 days)
wovely.app.jwtExpirationMs=${JWT_EXPIRATION_MS:900000}
wovely.app.refreshExpirationMs=${REFRESH_EXPIRATION_MS:604800000}
wovely.internal.apiKey=${INTERNAL_API_KEY}

# Public product reads (price lookup at checkout) and internal stock endpoints
products.api.url=${PRODUCTS_API_URL:http://localhost:8082/api/products}
inventory.internal.url=${INVENTORY_INTERNAL_URL:http://localhost:8083/internal/inventory}

cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Demo users (admin/seller/testuser) are only seeded with SPRING_PROFILES_ACTIVE=dev

# Observability (PLAN.md 4.6): health only, probes for docker/k8s; correlation id in every log line
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
logging.pattern.level=%5p [%X{correlationId:-}]
inventory.release-retry-ms=${INVENTORY_RELEASE_RETRY_MS:30000}
