spring.application.name=products
server.port=8082

spring.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/wp2-project}
# Create @Indexed / @CompoundIndex indexes on startup (PLAN.md 2.10)
spring.data.mongodb.auto-index-creation=true

# Secrets come from the environment (see .env.example). No defaults on purpose.
wovely.app.jwtSecret=${JWT_SECRET}
wovely.internal.apiKey=${INTERNAL_API_KEY}

# Internal (service-to-service) base URL of the inventory service
inventory.internal.url=${INVENTORY_INTERNAL_URL:http://localhost:8083/internal/inventory}

cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Core service internal base URL (admin moderation audit events)
core.internal.url=${CORE_INTERNAL_URL:http://localhost:8081/internal}

# Observability (PLAN.md 4.6): health only, probes for docker/k8s; correlation id in every log line
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
logging.pattern.level=%5p [%X{correlationId:-}]

# RabbitMQ (PLAN.md 4.2): stock read model fed by inventory events; failures go to the DLQ after retries
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=500ms
