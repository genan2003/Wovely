# SPA + same-origin API (PLAN.md 4.1): the browser only ever talks to this server, so no CORS is needed.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.csr.html index.html;

    # Basic hardening
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://gateway:8090;
        proxy_set_header Host $host;
        # The gateway rate-limits anonymous clients by this header; overwrite whatever the client sent
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /ws {
        proxy_pass http://gateway:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
    }

    # Never expose service-to-service endpoints
    location /internal/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.csr.html;
    }
}
