<div class="wv-page settings-page">
  <header class="wv-page-head">
    <h1>Settings</h1>
    <p>Your profile, addresses and wallet.</p>
  </header>

  <section class="settings-section" aria-labelledby="profile-title">
    <h2 id="profile-title">Profile</h2>
    <form [formGroup]="form" (ngSubmit)="saveProfile()">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="fullName">Full name</label>
          <input id="fullName" type="text" class="form-control" formControlName="fullName" autocomplete="name">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="username">Username</label>
          <input id="username" type="text" class="form-control" [value]="username()" disabled>
        </div>
        @if (isSeller()) {
          <div class="col-md-6">
            <label class="form-label" for="workshopCity">Workshop city</label>
            <input id="workshopCity" type="text" class="form-control" formControlName="city" aria-describedby="city-help">
            <div class="form-text" id="city-help">Shown on your public maker profile.</div>
          </div>
          <div class="col-12">
            <label class="form-label" for="workshopImage">Workshop photo URL</label>
            <input id="workshopImage" type="url" class="form-control" formControlName="workshopImageUrl" aria-describedby="image-help">
            <div class="form-text" id="image-help">Buyers see this next to your products.</div>
          </div>
          <div class="col-12">
            <label class="form-label" for="makerStory">Your story</label>
            <textarea id="makerStory" class="form-control" formControlName="makerStory" rows="4"></textarea>
          </div>
        }
      </div>
      <div class="settings-actions">
        <button type="submit" class="btn btn-primary" [disabled]="form.pristine || form.invalid">Save changes</button>
      </div>
    </form>
  </section>

  <section class="settings-section" id="addresses">
    <app-address-book />
  </section>

  <section class="settings-section" id="wallet">
    <app-wallet-panel [seller]="!!isSeller()" />
  </section>
</div>
