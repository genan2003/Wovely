<div class="settings-page">
    <div class="container py-5">
        <h1 class="display-4 fw-bold mb-5 text-center">Settings</h1>

        <div class="row justify-content-center">
            <div class="col-lg-10">
                
                <!-- Profile Section -->
                <div class="card settings-card p-4">
                    <h3 class="card-title d-flex align-items-center">
                        <i class="bi bi-person-circle section-icon"></i>
                        Profile Information
                    </h3>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" [(ngModel)]="profile.fullName" placeholder="Enter your full name">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" [value]="username()" disabled>
                        </div>
                        @if (isSeller()) {
                            <div class="col-md-6">
                                <label class="form-label" for="workshopCity">Workshop city</label>
                                <input id="workshopCity" type="text" class="form-control" [(ngModel)]="profile.city" placeholder="Sibiu">
                                <small class="text-muted">Shown on your public seller profile.</small>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Workshop / Profile Image URL</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-image"></i></span>
                                    <input type="text" class="form-control" [(ngModel)]="profile.workshopImageUrl" placeholder="https://example.com/your-image.jpg">
                                </div>
                                <small class="text-muted">This image will be shown to customers in the 'About Seller' section.</small>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Maker Bio / Story</label>
                                <textarea class="form-control" [(ngModel)]="profile.makerStory" rows="4" placeholder="Share your story with your customers..."></textarea>
                            </div>
                        }
                    </div>
                    <div class="mt-4 text-end">
                        <button class="btn btn-save" (click)="saveProfile()">Save Changes</button>
                    </div>
                </div>

                <!-- Address book (checkout destinations) -->
                <div class="card settings-card p-4" id="addresses">
                    <app-address-book />
                </div>

                <!-- Wallet (PLAN.md 3.7) — replaces the old card/IBAN form, which never saved anything -->
                <div class="card settings-card p-4" id="wallet">
                    <app-wallet-panel [seller]="!!isSeller()" />
                </div>

            </div>
        </div>
    </div>
</div>
