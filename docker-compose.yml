# Wovely stack (PLAN.md 4.1 / 4.4). Browser → frontend (nginx :4200) → gateway → services.
# Service ports are published on 127.0.0.1 only, for Postman/debugging; the gateway is the real entry.
x-backend-env: &backend-env
  SPRING_DATA_MONGODB_URI: mongodb://wp2-project:27017/wp2-project
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env (see .env.example)}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}

x-rabbit-env: &rabbit-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: ${RABBITMQ_USER:-wovely}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env (see .env.example)}

x-healthcheck: &actuator-health
  interval: 10s
  timeout: 3s
  retries: 12
  start_period: 30s

services:
  wp2-project:
    image: mongo:9.0.4
    container_name: wp2-project
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4.1-alpine
    container_name: wovely-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    container_name: wovely-rabbitmq
    hostname: wovely-rabbitmq   # keeps the node name (and its data dir) stable across recreates
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-wovely}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:15672:15672"   # management UI for debugging
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  inventory:
    build: { context: ./backend, args: { SERVICE: inventory } }
    container_name: wovely-inventory
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      <<: [*backend-env, *rabbit-env]
    healthcheck:
      <<: *actuator-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP"]
    depends_on:
      wp2-project: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  products:
    build: { context: ./backend, args: { SERVICE: products } }
    container_name: wovely-products
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      <<: [*backend-env, *rabbit-env]
      INVENTORY_INTERNAL_URL: http://inventory:8083/internal/inventory
      CORE_INTERNAL_URL: http://wovely-backend:8081/internal
    healthcheck:
      <<: *actuator-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP"]
    depends_on:
      wp2-project: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      inventory: { condition: service_healthy }
    restart: unless-stopped

  wovely-backend:
    build: { context: ./backend, args: { SERVICE: wovely } }
    container_name: wovely-backend
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      <<: *backend-env
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      PRODUCTS_API_URL: http://products:8082/api/products
      INVENTORY_INTERNAL_URL: http://inventory:8083/internal/inventory
    healthcheck:
      <<: *actuator-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
    depends_on:
      wp2-project: { condition: service_healthy }
      products: { condition: service_healthy }
      inventory: { condition: service_healthy }
    restart: unless-stopped

  gateway:
    build: { context: ./backend, args: { SERVICE: gateway } }
    container_name: wovely-gateway
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      REDIS_HOST: redis
      CORE_URL: http://wovely-backend:8081
      CORE_WS_URL: ws://wovely-backend:8081
      PRODUCTS_URL: http://products:8082
      INVENTORY_URL: http://inventory:8083
    healthcheck:
      <<: *actuator-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health | grep -q UP"]
    depends_on:
      redis: { condition: service_healthy }
      wovely-backend: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/frontend
    container_name: wovely-frontend
    ports:
      - "4200:80"
    depends_on:
      gateway: { condition: service_healthy }
    restart: unless-stopped

volumes:
  mongodb_data:
  rabbitmq_data:
