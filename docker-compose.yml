services:
  wp2-project:
    image: mongo:latest
    container_name: wp2-project
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  inventory:
    build:
      context: ./backend/inventory
    container_name: wovely-inventory
    ports:
      - "8083:8083"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://wp2-project:27017/wp2-project
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env (see .env.example)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    depends_on:
      - wp2-project
    restart: unless-stopped

  products:
    build:
      context: ./backend/products
    container_name: wovely-products
    ports:
      - "8082:8082"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://wp2-project:27017/wp2-project
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env (see .env.example)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      INVENTORY_INTERNAL_URL: http://inventory:8083/internal/inventory
    depends_on:
      - wp2-project
      - inventory
    restart: unless-stopped

  wovely-backend:
    build:
      context: ./backend/wovely
    container_name: wovely-backend
    ports:
      - "8081:8081"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://wp2-project:27017/wp2-project
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env (see .env.example)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      PRODUCTS_API_URL: http://products:8082/api/products
      PRODUCTS_INTERNAL_URL: http://products:8082/internal/products
      INVENTORY_INTERNAL_URL: http://inventory:8083/internal/inventory
    depends_on:
      - wp2-project
      - products
      - inventory
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/frontend
    container_name: wovely-frontend
    ports:
      - "4200:80"
    depends_on:
      - wovely-backend
      - products
    restart: unless-stopped

volumes:
  mongodb_data:
